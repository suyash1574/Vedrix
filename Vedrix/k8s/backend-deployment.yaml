apiVersion: apps/v1
kind: Deployment
metadata:
  name: vedrix-backend
  labels:
    app: vedrix-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: vedrix-backend
  template:
    metadata:
      labels:
        app: vedrix-backend
    spec:
      containers:
        - name: backend
          image: vedrix/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vedrix-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: vedrix-secrets
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vedrix-secrets
                  key: secret-key
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vedrix-secrets
                  key: groq-api-key
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vedrix-secrets
                  key: openrouter-api-key
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vedrix-secrets
                  key: nvidia-api-key
            - name: DB_SSL_MODE
              value: "require"
            - name: DB_POOL_SIZE
              value: "20"
            - name: DB_MAX_OVERFLOW
              value: "40"
            - name: DB_POOL_TIMEOUT
              value: "30"
            - name: DB_POOL_RECYCLE
              value: "1800"
            - name: DB_POOL_PRE_PING
              value: "true"
            - name: LANGGRAPH_CHECKPOINT_ENABLED
              value: "true"
            - name: LANGGRAPH_CHECKPOINT_RETENTION_DAYS
              value: "30"
            - name: NOOA_ENABLED
              value: "false"
            - name: VEDRIX_NOOA_GRAPH
              value: "false"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: vedrix-backend
spec:
  selector:
    app: vedrix-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP